
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found | CampusConnect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f3f6ff;
      color: #202b46;
    }
    header {
      background: linear-gradient(135deg, #3459dc, #7047d7);
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    header h2 { font-size: 25px; }
    header a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-weight: bold;
    }
    .hero {
      text-align: center;
      padding: 35px 15px 20px;
    }
    .hero h1 { font-size: 32px; margin-bottom: 10px; }
    .hero p { color: #68738d; }
    .container {
      max-width: 1050px;
      margin: 20px auto 45px;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 25px #263c7810;
    }
    .card h2 { font-size: 21px; margin-bottom: 20px; }
    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 15px 0 7px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce2f0;
      border-radius: 9px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #526de0;
    }
    textarea { resize: vertical; min-height: 90px; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      padding: 11px 5px;
      border: 1px solid #dce2f0;
      border-radius: 9px;
      background: white;
      cursor: pointer;
      font-weight: bold;
      color: #52617e;
    }
    .tab.active {
      background: #e9edff;
      border-color: #536ee0;
      color: #3454ce;
    }
    .submit {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, #3459dc, #7047d7);
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .submit:disabled { opacity: .6; cursor: wait; }
    #message {
      margin-top: 13px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .success { color: #13804a; }
    .error { color: #c62828; }
    .report {
      border: 1px solid #e7eaf3;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }
    .report h3 { margin: 10px 0; font-size: 18px; }
    .report p { margin-top: 8px; color: #65708a; line-height: 1.5; }
    .report img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 9px;
      margin-top: 12px;
    }
    .tag {
      display: inline-block;
      padding: 6px 10px;
      background: #e9edff;
      color: #3454ce;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .empty { color: #78839b; padding: 15px 0; line-height: 1.5; }
    footer { text-align: center; padding: 22px; color: #78839b; }
    @media (max-width: 760px) {
      .container { grid-template-columns: 1fr; }
      header { padding: 20px; }
      header a { margin-left: 10px; }
      .hero h1 { font-size: 27px; }
    }
  </style>
</head>

<body>
  <header>
    <h2>CampusConnect</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="student-dashboard.html">Dashboard</a>
      <a href="notices.html">Notices</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Lost & Found</h1>
    <p>Lost something on campus or found an item? Report it here.</p>
  </section>

  <main class="container">
    <section class="card">
      <h2 id="formTitle">Report an Item</h2>

      <form id="itemForm">
        <div class="tabs">
          <button type="button" class="tab active" data-type="Lost Item">Lost Item</button>
          <button type="button" class="tab" data-type="Found Item">Found Item</button>
        </div>

        <label for="itemName">Item Name *</label>
        <input id="itemName" required maxlength="150"
          placeholder="e.g. Blue water bottle">

        <label for="ownerName">Your Name *</label>
        <input id="ownerName" required maxlength="100"
          placeholder="Enter your name">

        <label for="contact">Contact Email *</label>
        <input id="contact" type="email" required maxlength="254"
          placeholder="Enter your email">

        <label for="location">Location *</label>
        <input id="location" required maxlength="200"
          placeholder="Where was it lost or found?">

        <label for="date">Date *</label>
        <input id="date" type="date" required>

        <label for="description">Description *</label>
        <textarea id="description" required maxlength="2000"
          placeholder="Describe the item and other details"></textarea>

        <label for="photo">Upload Photo (Optional)</label>
        <input id="photo" type="file" accept="image/*">
        <div id="preview"></div>
        <button type="button" id="removePhoto"
          style="display:none;margin-top:8px;cursor:pointer">
          Remove Photo
        </button>

        <button class="submit" id="submitButton" type="submit">
          Submit Report
        </button>
        <p id="message" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Recent Reports</h2>
      <p class="empty" id="loadingMessage">Loading reports...</p>
      <div id="itemsList"></div>
    </section>
  </main>

  <footer>© 2026 CampusConnect | College Support Portal</footer>

  <script>
    // Replace these two values with your Supabase project details.
    const SUPABASE_URL = "https://nezrjrcxjeftsibqtcqy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qUx0J0GAxsyI7u77u1Z1yw_CKSnYIK7";

    const configured =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("PASTE_") &&
      !SUPABASE_KEY.includes("PASTE_") &&
      SUPABASE_KEY.trim() !== "";

    const db = configured
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    let selectedType = "Lost Item";
    let previewUrl = null;

    const form = document.getElementById("itemForm");
    const photoInput = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const removePhoto = document.getElementById("removePhoto");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const itemsList = document.getElementById("itemsList");
    const loadingMessage = document.getElementById("loadingMessage");

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        selectedType = button.dataset.type;

        document.querySelectorAll(".tab").forEach(tab => {
          tab.classList.toggle("active", tab === button);
        });

        document.getElementById("formTitle").textContent =
          selectedType === "Lost Item"
            ? "Report a Lost Item"
            : "Report a Found Item";
      });
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      preview.innerHTML = "";
      removePhoto.style.display = "none";

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        photoInput.value = "";
        showMessage("Please select an image file.", true);
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        photoInput.value = "";
        showMessage("Photo must be smaller than 5 MB.", true);
        return;
      }

      previewUrl = URL.createObjectURL(file);
      const img = document.createElement("img");
      img.src = previewUrl;
      img.alt = "Selected item photo";
      img.style.cssText =
        "width:100%;max-height:180px;object-fit:cover;margin-top:12px;border-radius:9px";
      preview.appendChild(img);
      removePhoto.style.display = "inline-block";
    });

    removePhoto.addEventListener("click", () => {
      photoInput.value = "";
      preview.innerHTML = "";
      removePhoto.style.display = "none";
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    });

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "error" : "success";
    }

    async function uploadPhoto(file) {
      if (!file) return null;

      const extension = file.name.split(".").pop().replace(/[^a-zA-Z0-9]/g, "");
      const path = "lost-found/" + Date.now() + "-" +
        Math.random().toString(36).slice(2) + "." + extension;

      const { error } = await db.storage
        .from("campus-photos")
        .upload(path, file, { upsert: false, contentType: file.type });

      if (error) throw new Error("Photo upload failed: " + error.message);

      // Store the path. For a private bucket, create a signed URL when displaying.
      return path;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!db) {
        showMessage("Add your Supabase project URL and publishable key in this file first.", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";
      showMessage("");

      try {
        const file = photoInput.files[0];
        const photoPath = await uploadPhoto(file);

        const report = {
          report_type: selectedType,
          item_name: document.getElementById("itemName").value.trim(),
          reporter_name: document.getElementById("ownerName").value.trim(),
          contact_email: document.getElementById("contact").value.trim(),
          location: document.getElementById("location").value.trim(),
          item_date: document.getElementById("date").value,
          description: document.getElementById("description").value.trim(),
          photo_url: photoPath,
          status: "Open"
        };

        const { error } = await db.from("lost_found").insert([report]);

        if (error) throw error;

        form.reset();
        selectedType = "Lost Item";
        document.querySelectorAll(".tab").forEach((tab, index) => {
          tab.classList.toggle("active", index === 0);
        });
        document.getElementById("formTitle").textContent = "Report a Lost Item";
        preview.innerHTML = "";
        removePhoto.style.display = "none";
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = null;

        showMessage("Report submitted successfully!");
        await loadReports();
      } catch (error) {
        showMessage("Could not submit report: " + (error.message || "Please try again."), true);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit Report";
      }
    });

    async function loadReports() {
      if (!db) {
        loadingMessage.textContent = "Configure Supabase URL and publishable key to load reports.";
        return;
      }

      loadingMessage.textContent = "Loading reports...";
      itemsList.innerHTML = "";

      const { data, error } = await db
        .from("lost_found")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        loadingMessage.textContent = "Could not load reports: " + error.message;
        return;
      }

      loadingMessage.textContent = data.length
        ? ""
        : "No reports yet. Be the first to report an item!";

      for (const item of data) {
        const card = document.createElement("article");
        card.className = "report";

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = item.report_type || "Item";

        const title = document.createElement("h3");
        title.textContent = item.item_name || "Untitled item";

        const description = document.createElement("p");
        description.textContent = item.description || "";

        const details = document.createElement("p");
        details.textContent =
          "Location: " + (item.location || "Not specified") +
          " · Date: " + (item.item_date || "Not specified") +
          " · Status: " + (item.status || "Open");

        const reporter = document.createElement("p");
        reporter.textContent = "Reported by: " + (item.reporter_name || "Campus member");

        card.append(tag, title, description, details, reporter);

        if (item.photo_url) {
          const { data: signedData, error: signedError } = await db.storage
            .from("campus-photos")
            .createSignedUrl(item.photo_url, 3600);

          if (!signedError && signedData?.signedUrl) {
            const img = document.createElement("img");
            img.src = signedData.signedUrl;
            img.alt = "Photo of " + (item.item_name || "reported item");
            card.appendChild(img);
          }
        }

        itemsList.appendChild(card);
      }
    }

    loadReports();
  </script>
</body>
</html>
